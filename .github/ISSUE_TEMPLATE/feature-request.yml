name: Sugerir uma melhoria
description: Sugira uma nova função ou uma mudança no site.
title: "Melhoria: "
body:
  - type: textarea
    id: problem
    attributes:
      label: O que está difícil ou faltando?
      description: Explique a necessidade e quem seria ajudado por essa mudança.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: O que você gostaria que acontecesse?
      description: Descreva como a melhoria poderia ajudar. Não precisa saber como programá-la.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Como saberemos que está pronta?
      description: Liste os resultados que espera ver ou conseguir fazer depois da mudança.
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: Sugestões para começar
      description: Cite um exemplo, uma página parecida ou outra ideia que possa ajudar. Se não souber, escreva "Não sei".
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Informações e limites importantes
      description: Diga onde essa mudança deve aparecer, o que deve continuar funcionando ou o que precisa ser evitado.
    validations:
      required: true
